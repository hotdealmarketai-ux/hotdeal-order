name: media-backup

# 매일 업로드 미디어(실물 파일)를 받아 GitHub 아티팩트로 30일 보관(오프사이트).
# DB(pg_dump)엔 파일 URL만 있어 '전체 복구'가 빠짐없이 되려면 실물도 따로 백업해야 한다.
#  · Supabase Storage: 사업자등록증 + 온보딩 이미지
#  · Vercel Blob: 메신저/채팅 첨부, 회의록, 공지 이미지
# ⚠ 저장소 Settings > Secrets > Actions 에 필요:
#    SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, SUPABASE_STORAGE_BUCKET(=business-certs), BLOB_READ_WRITE_TOKEN
#    (없는 저장소는 자동으로 건너뛴다)
on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST (db-backup 과 동일 시각대)
  workflow_dispatch:

concurrency:
  group: media-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install blob SDK
        run: npm i @vercel/blob --no-save --no-audit --no-fund
      - name: Download all media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/media-backup.mjs
      - name: Package
        run: |
          mkdir -p media-backup
          tar -czf "media-$(date -u +%Y%m%d).tar.gz" -C media-backup .
          ls -lh media-*.tar.gz
          echo "파일 개수: $(find media-backup -type f | wc -l)"
      - name: Upload media artifact (30d retention)
        uses: actions/upload-artifact@v4
        with:
          name: media-backup-${{ github.run_id }}
          path: media-*.tar.gz
          retention-days: 30
          if-no-files-found: error
      - name: Alert on failure (open/append issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ 백업 실패 알림 (media-backup)";
            const body = `media-backup 워크플로가 실패했습니다.\n실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n시각(UTC): ${new Date().toISOString()}`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count > 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: found.data.items[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
