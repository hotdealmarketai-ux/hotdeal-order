name: db-backup

# 매일 Neon DB 전체를 pg_dump → GitHub 아티팩트로 30일 보관(오프사이트 백업).
# in-DB 스냅샷(AppMeta)은 DB가 죽으면 같이 죽으므로, 다른 곳(GitHub)에 실물 덤프를 둔다.
# ⚠ 최초 1회: GitHub 저장소 Settings > Secrets > Actions 에 NEON_DATABASE_URL 추가
#    (값 = Neon 직결(unpooled) 연결 문자열, sslmode=require 포함).
on:
  schedule:
    - cron: "0 22 * * *" # 07:00 KST 매일(새벽 1~6시 출고 조회창 이후, 저트래픽)
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Dump Neon DB (custom format, compressed)
        run: |
          if [ -z "${{ secrets.NEON_DATABASE_URL }}" ]; then
            echo "NEON_DATABASE_URL 시크릿이 없습니다 — 저장소 Secrets에 추가하세요." >&2
            exit 1
          fi
          # 서버 버전과 무관하게 최신 pg_dump 사용(신 버전 pg_dump는 구 버전 서버 덤프 가능).
          docker run --rm -e PGCONN="${{ secrets.NEON_DATABASE_URL }}" postgres:17 \
            sh -c 'pg_dump "$PGCONN" --no-owner --no-privileges -Fc' > "neon-$(date -u +%Y%m%d).dump"
          ls -lh neon-*.dump
      - name: Verify dump integrity (readable TOC + enough tables)
        run: |
          # 업로드 전에 방금 뜬 덤프가 '읽히는지 + 테이블이 들어있는지' 확인 → 손상/절단 덤프 조기 차단.
          DUMP=$(ls neon-*.dump)
          SIZE=$(stat -c%s "$DUMP")
          echo "덤프 크기: $SIZE bytes"
          if [ "$SIZE" -lt 10000 ]; then echo "::error::덤프가 비정상적으로 작음($SIZE B) — 실패 처리"; exit 1; fi
          TABLES=$(docker run --rm -v "$PWD:/b" postgres:17 pg_restore -l "/b/$DUMP" | grep -c "TABLE DATA" || true)
          echo "복원 목차의 데이터 테이블 수: $TABLES"
          if [ "${TABLES:-0}" -lt 10 ]; then echo "::error::덤프 목차 테이블이 너무 적음($TABLES) — 손상 의심, 실패 처리"; exit 1; fi
          echo "✅ 덤프 무결성 OK"
      - name: Upload backup artifact (30d retention)
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: neon-*.dump
          retention-days: 30
          if-no-files-found: error
      - name: Alert on failure (open/append issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "⚠️ 백업 실패 알림 (db-backup)";
            const body = `db-backup 워크플로가 실패했습니다 — 전체 DB 백업이 만들어지지 않았습니다. 즉시 확인 필요.\n실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n시각(UTC): ${new Date().toISOString()}`;
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const found = await github.rest.search.issuesAndPullRequests({ q });
            if (found.data.total_count > 0) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: found.data.items[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
